<!DOCTYPE html>
<html lang="pt-BR" data-theme="light">
<head>
  <meta charset="UTF-8">
  <title>Nexua Achadinhos</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <style>
    :root{
      --paper:#f6f4ee;
      --ink:#14151f;
      --muted:#5c5d70;
      --line:#e3e0d5;
      --card-bg:#ffffff;
      --topbar-bg:rgba(246,244,238,0.85);
      --brand:#5b56ff;
      --brand-ink:#ffffff;
      --brand-soft:#ecebff;
      --deal:#e0451a;
      --deal-soft:#ffe9e0;
      --shadow:rgba(20,21,31,0.10);
      --glow:rgba(91,86,255,0.16);
    }
    :root:not([data-theme="light"]){
      @media (prefers-color-scheme: dark){
        --paper:#0e0e16;
        --ink:#f1f0ea;
        --muted:#a3a2b8;
        --line:#2a2b3c;
        --card-bg:#181926;
        --topbar-bg:rgba(14,14,22,0.85);
        --brand:#9a95ff;
        --brand-ink:#14151f;
        --brand-soft:#25243f;
        --deal:#ff7a4d;
        --deal-soft:#3a2418;
        --shadow:rgba(0,0,0,0.5);
        --glow:rgba(154,149,255,0.18);
      }
    }
    :root[data-theme="dark"]{
      --paper:#0e0e16;
      --ink:#f1f0ea;
      --muted:#a3a2b8;
      --line:#2a2b3c;
      --card-bg:#181926;
      --topbar-bg:rgba(14,14,22,0.85);
      --brand:#9a95ff;
      --brand-ink:#14151f;
      --brand-soft:#25243f;
      --deal:#ff7a4d;
      --deal-soft:#3a2418;
      --shadow:rgba(0,0,0,0.5);
      --glow:rgba(154,149,255,0.18);
    }
    *{box-sizing:border-box;}
    html{scroll-behavior:smooth;}
    html,body{margin:0;padding:0;}
    body{
      background:var(--paper);
      color:var(--ink);
      font-family:'Manrope',system-ui,-apple-system,'Segoe UI',sans-serif;
      min-height:100vh;
      -webkit-font-smoothing:antialiased;
    }
    a{color:inherit;}
    .wrap{max-width:1180px; margin:0 auto; padding:0 1.25rem;}
    /* ---------------- topbar ---------------- */
    .topbar{
      position:sticky; top:0; z-index:40;
      background:var(--topbar-bg);
      backdrop-filter:blur(10px);
      border-bottom:1px solid var(--line);
    }
    .topbar .wrap{
      display:flex; align-items:center; justify-content:space-between;
      height:64px;
      gap:0.75rem;
    }
    .brand-mark{
      display:flex; align-items:center; gap:0.55rem;
      font-family:'Bricolage Grotesque',sans-serif;
      font-weight:800; font-size:1.15rem; letter-spacing:-0.01em;
      text-decoration:none;
      flex-shrink:0;
    }
    .brand-mark .dot{
      width:30px;height:30px;border-radius:50%;
      background:linear-gradient(150deg,var(--brand),#ff8a5b);
      display:flex;align-items:center;justify-content:center;
      color:var(--brand-ink); font-weight:800; font-size:0.85rem;
      flex-shrink:0;
    }
    nav.cats{
      display:flex; align-items:center; gap:0.35rem;
    }
    .cat-btn{
      appearance:none; border:1px solid transparent; background:transparent;
      color:var(--muted); font-family:'Manrope',sans-serif; font-weight:700;
      font-size:0.86rem; padding:0.5rem 0.85rem; border-radius:999px;
      cursor:pointer; transition:background 0.15s ease, color 0.15s ease;
      white-space:nowrap;
    }
    .cat-btn:hover{background:var(--brand-soft); color:var(--ink);}
    .cat-btn.active{background:var(--brand); color:var(--brand-ink);}
    .cat-btn:focus-visible{outline:2px solid var(--brand); outline-offset:2px;}
    .menu-toggle{
      display:none;
      appearance:none; border:1px solid var(--line); background:var(--card-bg);
      width:40px; height:40px; border-radius:10px;
      align-items:center; justify-content:center; cursor:pointer;
      color:var(--ink);
    }
    .menu-toggle svg{width:20px;height:20px;}
    /* ---------------- hero banner ---------------- */
    .hero{
      position:relative;
      overflow:hidden;
      padding:3.25rem 0 2.75rem;
      background:
        radial-gradient(circle at 12% 20%, var(--glow), transparent 45%),
        radial-gradient(circle at 88% 0%, var(--glow), transparent 40%);
    }
    .hero .wrap{
      display:flex; flex-direction:column; align-items:center; text-align:center; gap:1.1rem;
    }
    .avatar{
      width:72px;height:72px;border-radius:50%;
      display:flex;align-items:center;justify-content:center;
      font-family:'Bricolage Grotesque',sans-serif;
      font-weight:800;font-size:1.5rem;color:var(--brand-ink);
      background:linear-gradient(150deg,var(--brand),#ff8a5b);
      box-shadow:0 10px 24px -8px var(--shadow);
    }
    .hero h1{
      font-family:'Bricolage Grotesque',sans-serif;
      font-size:clamp(1.8rem, 4vw, 2.5rem);
      font-weight:800; letter-spacing:-0.02em; margin:0;
      text-wrap:balance;
    }
    .hero p{
      color:var(--muted); font-size:1rem; line-height:1.6; max-width:460px; margin:0;
    }
    .hero p strong{color:var(--ink); font-weight:700;}
    /* ---------------- grid section ---------------- */
    .grid-section{padding:2.5rem 0 4rem;}
    .section-label{
      display:flex; align-items:baseline; gap:0.6rem; margin-bottom:1.5rem;
    }
    .section-label h2{
      font-family:'Bricolage Grotesque',sans-serif; font-size:1.3rem; font-weight:700;
      margin:0; letter-spacing:-0.01em;
    }
    .section-label span{font-size:0.8rem;color:var(--muted); font-variant-numeric:tabular-nums;}
    .section-label::after{content:""; flex:1; height:1px; background:var(--line);}
    .deal-grid{
      display:grid;
      grid-template-columns:repeat(4, 1fr);
      gap:1.4rem;
    }
    @media (max-width:1020px){ .deal-grid{grid-template-columns:repeat(2, 1fr);} }
    @media (max-width:560px){ .deal-grid{grid-template-columns:1fr;} }
    .deal-card{
      background:var(--card-bg);
      border:1px solid var(--line);
      border-radius:20px;
      overflow:hidden;
      box-shadow:0 14px 30px -20px var(--shadow);
      display:flex; flex-direction:column;
      opacity:0; transform:translateY(10px);
      animation:cardIn 0.5s ease forwards;
    }
    @keyframes cardIn{ to{ opacity:1; transform:translateY(0);} }
    .deal-card.is-hidden{display:none;}
    .deal-media{ position:relative; aspect-ratio:1/1; background:var(--brand-soft); }
    .deal-media img{ width:100%; height:100%; object-fit:cover; display:block; }
    .deal-image-fallback{
      width:100%; height:100%;
      display:flex; flex-direction:column; align-items:center; justify-content:center;
      gap:0.55rem; padding:1.25rem; text-align:center;
      color:var(--muted); background:var(--brand-soft);
      font-size:0.82rem; font-weight:700;
    }
    .deal-image-fallback svg{ width:30px; height:30px; opacity:0.7; }
    .deal-image-fallback strong{ color:var(--ink); font-size:0.88rem; }
    .deal-badge{
      position:absolute; top:0.7rem; left:0.7rem;
      background:var(--deal); color:#fff;
      font-family:'JetBrains Mono',monospace; font-weight:700; font-size:0.72rem;
      padding:0.28rem 0.55rem; border-radius:8px; letter-spacing:0.02em;
    }

    .deal-body{
      padding:1rem 1.05rem 1.15rem;
      display:flex; flex-direction:column; gap:0.7rem;
      flex:1;
    }
    .deal-title{
      font-family:'Bricolage Grotesque',sans-serif; font-weight:700;
      font-size:0.98rem; line-height:1.28; text-wrap:balance; margin:0;
      min-height:2.5em;
    }
    .deal-benefit{
      font-size:0.8rem; color:var(--muted); line-height:1.45; margin:0;
      display:flex; gap:0.4rem;
    }
    .deal-benefit::before{ content:"✓"; color:var(--brand); font-weight:800; flex-shrink:0; }
    .deal-spacer{flex:1;}
    .price-row{
      display:flex; align-items:baseline; gap:0.5rem;
      font-family:'JetBrains Mono',monospace;
    }
    .price-now{ font-size:1.3rem; font-weight:700; color:var(--ink); font-variant-numeric:tabular-nums; }
    .price-was{ font-size:0.78rem; color:var(--muted); text-decoration:line-through; font-variant-numeric:tabular-nums; }
    .cta{
      display:flex;
      align-items:center;
      justify-content:center;
      gap:0.45rem;
      width:100%;
      min-height:44px;
      background:var(--brand);
      color:var(--brand-ink);
      text-decoration:none;
      font-weight:700;
      font-size:0.86rem;
      line-height:1;
      padding:0.75rem 0.9rem;
      border-radius:12px;
      white-space:nowrap;
      transition:transform 0.15s ease, box-shadow 0.15s ease;
    }
    .cta svg{
      width:18px;
      height:18px;
      flex:0 0 18px;
      display:block;
    }
    .cta:hover{ transform:translateY(-2px); box-shadow:0 10px 20px -10px var(--glow); }

    /* ---------------- mobile fixes ---------------- */
    @media (max-width:640px){
      nav.cats{
        flex:1 1 auto;
        min-width:0;
        flex-wrap:nowrap;
        overflow-x:auto;
        -webkit-overflow-scrolling:touch;
        scrollbar-width:none;
        justify-content:flex-start;
        mask-image:linear-gradient(to right, transparent 0, black 12px, black calc(100% - 12px), transparent 100%);
      }
      nav.cats::-webkit-scrollbar{ display:none; }
      .cat-btn{ flex-shrink:0; white-space:nowrap; padding:0.45rem 0.7rem; font-size:0.8rem; }
      .brand-mark{ font-size:1rem; }
      .brand-mark .dot{ width:26px; height:26px; }
    }
  </style>
</head>
<body>
<header class="topbar">
  <div class="wrap">
    <a class="brand-mark" href="#top">
      <img src="https://instagram.fsdu25-1.fna.fbcdn.net/v/t51.82787-19/784518220_18150708643526075_6039185878605330549_n.jpg?stp=dst-jpg_s150x150_tt6&_nc_cat=109&ccb=7-5&_nc_sid=f7ccc5&efg=eyJ2ZW5jb2RlX3RhZyI6InByb2ZpbGVfcGljLnd3dy4xMDgwLkMzIn0%3D&_nc_ohc=b943XFRb_BoQ7kNvwFZF0q8&_nc_oc=AdoyPZAaUDHSt6qx8DT_nczrxzIhIptrXrxFvBrwP0dn1OrxH0JyIKA4x5-tnpUPEYB-znvZrQcOV1dkNq3TFgmq&_nc_zt=24&_nc_ht=instagram.fsdu25-1.fna&_nc_gid=j8hA4pxJJ3kWKMCrz3_kkQ&_nc_ss=7b2a8&oh=00_AQFgo9mEbueuov05XKL_5Yw2w10uBhoNl3Jh8_OvijXBpA&oe=6A925B78" class="dot" style="object-fit: cover; border: none; background: transparent;" alt="Logo">
      nexua
    </a>
    <nav class="cats" id="catNav">
      <button class="cat-btn active" data-filter="all">Todos</button>
    </nav>
  </div>
</header>
<section class="hero" id="top">
  <div class="wrap">
    <img src="https://instagram.fsdu25-1.fna.fbcdn.net/v/t51.82787-19/784518220_18150708643526075_6039185878605330549_n.jpg?stp=dst-jpg_s150x150_tt6&_nc_cat=109&ccb=7-5&_nc_sid=f7ccc5&efg=eyJ2ZW5jb2RlX3RhZyI6InByb2ZpbGVfcGljLnd3dy4xMDgwLkMzIn0%3D&_nc_ohc=b943XFRb_BoQ7kNvwFZF0q8&_nc_oc=AdoyPZAaUDHSt6qx8DT_nczrxzIhIptrXrxFvBrwP0dn1OrxH0JyIKA4x5-tnpUPEYB-znvZrQcOV1dkNq3TFgmq&_nc_zt=24&_nc_ht=instagram.fsdu25-1.fna&_nc_gid=j8hA4pxJJ3kWKMCrz3_kkQ&_nc_ss=7b2a8&oh=00_AQFgo9mEbueuov05XKL_5Yw2w10uBhoNl3Jh8_OvijXBpA&oe=6A925B78" class="avatar" style="object-fit: cover;" alt="Logo">
    <h1>Achadinhos que valem o clique</h1>
    <p>
      🔥 <strong>Achadinhos e ofertas da Shopee</strong> testados e aprovados, direto do @nexua2026.
      Toca no card do produto pra garantir o seu.
    </p>
  </div>
</section>
<main class="grid-section">
  <div class="wrap">
    <div class="section-label">
      <h2>Achadinhos ativos</h2>
      <span id="dealCount">Carregando...</span>
    </div>
    <div class="deal-grid" id="dealGrid">
      <!-- Cards serão injetados via JavaScript pelo Supabase -->
    </div>
  </div>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  const dealGrid = document.getElementById('dealGrid');
  const dealCount = document.getElementById('dealCount');
  const catNav = document.getElementById('catNav');
  // Captura erros globais para ajudar a debugar caso o script falhe
  window.onerror = function(msg, url, line, col, error) {
    dealGrid.innerHTML = '<div class="empty-state show" style="grid-column: 1 / -1;">Erro crítico no script: ' + msg + '<br>Verifique se o seu navegador bloqueou o carregamento de scripts.</div>';
    dealCount.textContent = "Erro";
  };
  // Inicializa o cliente Supabase com as credenciais lidas do log
  const supabaseUrl = 'https://sswbatfjamcrlbdltsbq.supabase.co';
  const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNzd2JhdGZqYW1jcmxiZGx0c2JxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzE0MTU1NTksImV4cCI6MjA4Njk5MTU1OX0.-jtdUMc2jpS7EKOVGAVpz3eyA9mj4JrqdeBsErZnhk4';
  const supabaseClient = window.supabase.createClient(supabaseUrl, supabaseKey);
  let allProducts = [];
  // Função principal para buscar produtos no banco
  async function loadProducts() {
    try {
      const { data, error } = await supabaseClient
        .from('achadinhos_produtos')
        .select('*')
        .order('ordem', { ascending: true });
      if (error) throw error;

      allProducts = data || [];
      renderCategoryNav(allProducts);
      renderProducts('all');
      setupFilters();
    } catch (error) {
      console.error("Erro ao carregar produtos:", error);
      dealGrid.innerHTML = '<div class="empty-state show">Erro ao conectar com o banco de dados.</div>';
      dealCount.textContent = "0 no ar";
    }
  }
  // Gera os botões de categoria dinamicamente a partir dos produtos vindos do Supabase.
  // Assim, toda nova categoria criada na tabela aparece aqui automaticamente, sem editar o HTML.
  function renderCategoryNav(produtos) {
    Array.from(catNav.querySelectorAll('.cat-btn:not([data-filter="all"])')).forEach(b => b.remove());
    const seen = new Set();
    produtos.forEach(p => {
      if (p.categoria && !seen.has(p.categoria)) {
        seen.add(p.categoria);
        const btn = document.createElement('button');
        btn.className = 'cat-btn';
        btn.dataset.filter = p.categoria;
        btn.textContent = p.categoria_label || p.categoria;
        catNav.appendChild(btn);
      }
    });
  }
  // Exibe um fallback quando a URL da imagem estiver vazia, expirada ou bloqueada
  function showImageFallback(media, productName, imageUrl) {
    console.warn('Imagem não carregou:', {
      produto: productName,
      imagem_url: imageUrl || '(vazia)'
    });
    media.innerHTML = `
      <div class="deal-image-fallback" role="img" aria-label="Imagem indisponível para ${productName || 'produto'}">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
          <rect x="3" y="4" width="18" height="16" rx="2"></rect>
          <circle cx="8.5" cy="9" r="1.5"></circle>
          <path d="M21 15l-5-5L5 20"></path>
        </svg>
        <strong>Imagem indisponível</strong>
        <span>${productName || 'Produto'}</span>
      </div>
    `;
  }
  // Renderiza os produtos baseados no filtro selecionado
  function renderProducts(filterCat) {
    dealGrid.innerHTML = ''; // Limpa a vitrine
    let count = 0;

    allProducts.forEach((p, index) => {
      // Aplica o filtro de categoria
      if (filterCat !== 'all' && p.categoria !== filterCat) return;
      count++;

      // Formata moedas para padrão BRL
      const precoAtualFmt = new Intl.NumberFormat('pt-BR', { style: 'currency', currency: 'BRL' }).format(p.preco_atual);
      const precoAntigoFmt = p.preco_antigo ? new Intl.NumberFormat('pt-BR', { style: 'currency', currency: 'BRL' }).format(p.preco_antigo) : '';

      const card = document.createElement('div');
      card.className = 'deal-card';
      card.dataset.cat = p.categoria;
      card.style.animationDelay = `${index * 0.05}s`;

      card.innerHTML = `
        <div class="deal-media">
          <img class="deal-image" alt="${p.nome || 'Produto'}" loading="lazy" decoding="async" referrerpolicy="no-referrer">
          ${p.badge ? `<span class="deal-badge">${p.badge}</span>` : ''}
          ${p.avaliacao ? `<span class="deal-rating">★ ${p.avaliacao}</span>` : ''}
        </div>
        <div class="deal-body">
          <h3 class="deal-title">${p.nome}</h3>
          <p class="deal-benefit">${p.beneficio}</p>
          <div class="deal-spacer"></div>
          <div class="price-row">
            <span class="price-now">${precoAtualFmt}</span>
            <span class="price-was">${precoAntigoFmt}</span>
          </div>
          <a href="${p.link_afiliado}" target="_blank" class="cta">
            Eu Quero!
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
          </a>
        </div>
      `;
      const media = card.querySelector('.deal-media');
      const image = card.querySelector('.deal-image');
      const imageUrl = typeof p.imagem_url === 'string' ? p.imagem_url.trim() : '';
      if (imageUrl) {
        image.addEventListener('error', () => {
          showImageFallback(media, p.nome, imageUrl);
        }, { once: true });
        image.src = imageUrl;
      } else {
        showImageFallback(media, p.nome, imageUrl);
      }
      dealGrid.appendChild(card);
    });

    dealCount.textContent = `${count} no ar`;
    if (count === 0) {
      dealGrid.innerHTML = '<div class="empty-state show" style="grid-column: 1 / -1;">Nenhum achadinho encontrado.</div>';
    }
  }
  // Configura os botões de filtro
  function setupFilters() {
    const catBtns = document.querySelectorAll('.cat-btn');
    catBtns.forEach(btn => {
      btn.addEventListener('click', () => {
        catBtns.forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        renderProducts(btn.dataset.filter);
      });
    });
  }
  // Inicializa
  loadProducts();
</script>
</body>
</html>
